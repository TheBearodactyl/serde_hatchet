[package]
name = "serde_hatchet"
version = "0.1.0"
edition = "2024"
keywords = ["serde", "serialization", "serlang"]
categories = ["encoding"]

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
lto = false
codegen-units = 1
opt-level = 3
